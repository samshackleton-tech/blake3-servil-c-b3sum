name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-c@0.10.26
      - name: Install the independent b3sum reference
        run: cargo install b3sum --version 1.8.7 --locked
      - name: Build shared and static examples and run the end-to-end tests
        run: make test
